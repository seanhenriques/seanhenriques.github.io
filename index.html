<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sean Henriques</title>
    <style>
        * {
            user-select: none;
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Tahoma, "Segoe UI", Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            display: block;
        }

        /* Windows XP Desktop Background Container */
        .desktop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Classic XP Dialog Window */
        .window {
            width: 360px;
            background-color: #ece9d8;
            border: 1px solid #0054e3;
            border-radius: 8px 8px 3px 3px;
            box-shadow: 
                inset 0px 1px 0px rgba(255,255,255,0.8), 
                inset 1px 0px 0px rgba(255,255,255,0.5), 
                inset -1px 0px 0px rgba(255,255,255,0.5), 
                2px 2px 10px rgba(0,0,0,0.4);
            z-index: 2;
            position: relative;
        }

        /* XP Title Bar with Gradient */
        .title-bar {
            background: linear-gradient(to bottom, #0058e6 0%, #3a93ff 10%, #288efe 40%, #127dff 88%, #036bfc 100%);
            padding: 3px 5px 3px 4px;
            border-radius: 6px 6px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0036a6;
        }

        .title-bar-text {
            color: white;
            font-weight: bold;
            font-size: 13px;
            font-family: "Trebuchet MS", Tahoma, sans-serif;
            text-shadow: 1px 1px #0f1089;
            letter-spacing: 0.5px;
            padding-left: 2px;
            display: grid;
        }

        .title-bar-text span {
            grid-area: 1 / 1;
        }

        .text-en {
            animation: fade-en 8s infinite ease-in-out;
        }

        .text-pt {
            animation: fade-pt 8s infinite ease-in-out;
        }

        @keyframes fade-en {
            0%, 35% { opacity: 1; }
            45%, 85% { opacity: 0; }
            95%, 100% { opacity: 1; }
        }

        @keyframes fade-pt {
            0%, 35% { opacity: 0; }
            45%, 85% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        /* XP Red Close Button */
        .close-btn {
            background: linear-gradient(to bottom, #e48777 0%, #ce432a 20%, #c83218 50%, #c4260a 80%, #b94232 100%);
            color: white;
            border: 1px solid white;
            border-radius: 3px;
            width: 21px;
            height: 21px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Tahoma;
            font-weight: bold;
            font-size: 11px;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* Window Content Area */
        .window-body {
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            border-top: 1px solid rgba(255,255,255,0.8);
        }

        h1 {
            font-size: 26px;
            font-weight: normal;
            color: #000;
            margin: 0;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.7);
        }

    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="desktop">
        <div class="window">
            <div class="title-bar">
                <div class="title-bar-text">
                    <span class="text-en">Good morning ☀️</span>
                    <span class="text-pt">Bom dia ☕</span>
                </div>
                <div class="close-btn">X</div>
            </div>
            <div class="window-body">
                <h1>Sean Henriques</h1>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let clouds = [];

        // Initialize clouds with random positions, scales, and speeds
        function initClouds() {
            clouds = [];
            const numClouds = Math.floor(window.innerWidth / 250) + 3; // Scale cloud count by width
            for (let i = 0; i < numClouds; i++) {
                clouds.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * (window.innerHeight * 0.4) + 20, // Keep in the upper 40%
                    scale: 0.4 + Math.random() * 0.6,
                    speed: 0.15 + Math.random() * 0.3
                });
            }
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initClouds(); // Re-distribute clouds on resize
        }

        window.addEventListener('resize', resize);
        resize(); // Initial sizing on load

        // Function to draw a fluffy cloud using overlapping arcs
        function drawCloud(ctx, x, y, scale) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; // Semi-transparent white
            ctx.beginPath();
            ctx.arc(x, y, 30 * scale, Math.PI * 0.5, Math.PI * 1.5);
            ctx.arc(x + 25 * scale, y - 20 * scale, 35 * scale, Math.PI * 1, Math.PI * 2);
            ctx.arc(x + 60 * scale, y - 10 * scale, 30 * scale, Math.PI * 1.2, Math.PI * 2);
            ctx.arc(x + 80 * scale, y, 30 * scale, Math.PI * 1.5, Math.PI * 0.5);
            ctx.moveTo(x + 80 * scale, y + 30 * scale);
            ctx.lineTo(x, y + 30 * scale);
            ctx.fill();
        }

        function animate(timestamp) {
            const w = canvas.width;
            const h = canvas.height;
            // Use the timestamp to create a slowly increasing time variable
            const t = (timestamp || 0) * 0.0005; 

            // Clear canvas and draw taller sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.75);
            skyGrad.addColorStop(0, '#1955c4');
            skyGrad.addColorStop(1, '#7db4f5');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, h);

            // Draw and animate clouds
            clouds.forEach(c => {
                c.x += c.speed;
                // Wrap around when off-screen
                if (c.x > w + 150) {
                    c.x = -150;
                    c.y = Math.random() * (h * 0.4) + 20; 
                }
                drawCloud(ctx, c.x, c.y, c.scale);
            });

            // Calculate lowered Y coordinates for the Background Hill (takes up bottom ~35%)
            const backHillY = h * 0.70 + Math.sin(t) * 15;
            const backCp1Y = h * 0.55 + Math.sin(t * 1.2) * 20;
            const backCp2Y = h * 0.80 + Math.cos(t * 0.8) * 25;
            const backEndY = h * 0.60 + Math.sin(t * 0.9) * 15;

            // Draw Background Hill
            ctx.beginPath();
            ctx.moveTo(0, backHillY);
            ctx.bezierCurveTo(w * 0.25, backCp1Y, w * 0.6, backCp2Y, w, backEndY);
            ctx.lineTo(w, h);
            ctx.lineTo(0, h);
            ctx.closePath();
            
            const hillGrad1 = ctx.createLinearGradient(0, h * 0.55, 0, h);
            hillGrad1.addColorStop(0, '#5ea82d');
            hillGrad1.addColorStop(1, '#3b7a19');
            ctx.fillStyle = hillGrad1;
            ctx.fill();

            // Calculate lowered Y coordinates for the Foreground Hill (takes up bottom ~25%)
            const frontHillY = h * 0.80 + Math.cos(t * 1.1) * 15;
            const frontCp1Y = h * 0.60 + Math.sin(t * 1.3) * 20;
            const frontCp2Y = h * 0.85 + Math.cos(t * 0.7) * 25;
            const frontEndY = h * 0.85 + Math.sin(t * 1.4) * 15;

            // Draw Foreground Hill
            ctx.beginPath();
            ctx.moveTo(w, frontHillY);
            ctx.bezierCurveTo(w * 0.7, frontCp1Y, w * 0.3, frontCp2Y, -50, frontEndY);
            ctx.lineTo(0, h);
            ctx.lineTo(w, h);
            ctx.closePath();
            
            const hillGrad2 = ctx.createLinearGradient(0, h * 0.65, 0, h);
            hillGrad2.addColorStop(0, '#7ce83a');
            hillGrad2.addColorStop(1, '#489420');
            ctx.fillStyle = hillGrad2;
            ctx.fill();

            // Request the next frame
            requestAnimationFrame(animate);
        }

        // Start the animation loop
        requestAnimationFrame(animate);
    </script>
</body>
</html>
